name: Zbuduj stronę

on:
  push:
    branches: [master]
    paths:
      - "dzialy/**"
      - "tools/build_site.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-push
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Generuj docs/
        run: python tools/build_site.py
      - name: Zapisz zmiany strony
        run: |
          if [ -n "$(git status --porcelain docs)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
            git add docs
            git commit -m "Przebuduj stronę"
            git pull --rebase
            git push
          fi
